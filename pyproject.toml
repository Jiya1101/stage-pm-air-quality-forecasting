[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqf"
version = "0.1.0"
description = "STAGE-PM: physics-constrained, source-aware transport graph network for PM2.5 forecasting"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
